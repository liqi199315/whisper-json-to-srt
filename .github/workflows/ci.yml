name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: whisper-json-to-srt-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Unit Tests, Build & SEO Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_SITE_URL: https://jsontosrt.com
      PUBLIC_GA4_MEASUREMENT_ID: G-085WZLBQ8F
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and CLI tests
        run: npm test

      - name: Build CLI, static site, and release manifest
        run: npm run build

      - name: Run SEO and artifact preflight check
        run: npm run seo:check
